{% extends 'base.html' %}

{% block title %}Analyzing Palm - AI Palmistry{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-5 rounded-4 border-gold-subtle shadow-lg">
                <div class="analysis-spinner-container position-relative mb-4 mx-auto">
                    <div class="spinner-border text-gold" style="width: 4rem; height: 4rem;" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <h3 class="fw-bold mb-2">Analyzing Palm Image</h3>
                <p class="text-secondary small mb-4" id="statusMessage">Detecting hand landmarks with MediaPipe...</p>

                <div class="progress bg-dark-subtle rounded-pill mb-3" style="height: 10px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-gold" id="progressBar" style="width: 25%"></div>
                </div>
                <div id="analysisErrorAlert" class="alert alert-danger d-none mt-3 small text-start">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> <span id="analysisErrorMessage"></span>
                    <div class="mt-2"><a href="{{ url_for('upload') }}" class="btn btn-outline-danger btn-sm rounded-pill">Try Another Photo</a></div>
                </div>
                <span class="extra-small text-muted">Please stay on this page while feature extraction finishes.</span>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const readingId = "{{ reading_id }}";
    const statusMsg = document.getElementById('statusMessage');
    const progressBar = document.getElementById('progressBar');
    const errorAlert = document.getElementById('analysisErrorAlert');
    const errorText = document.getElementById('analysisErrorMessage');

    const steps = [
        { progress: 30, text: "Detecting hand landmarks & palm boundary..." },
        { progress: 55, text: "Applying CLAHE contrast enhancement & noise reduction..." },
        { progress: 75, text: "Tracing major creases (Heart, Head, Life, Fate lines)..." },
        { progress: 90, text: "Generating traditional palmistry interpretation..." }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
        if (currentStep < steps.length) {
            progressBar.style.width = steps[currentStep].progress + '%';
            statusMsg.textContent = steps[currentStep].text;
            currentStep++;
        }
    }, 400);

    fetch(`/api/analyze/${readingId}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            clearInterval(interval);
            if (data.success) {
                progressBar.style.width = '100%';
                statusMsg.textContent = "Analysis complete! Redirecting to report...";
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 400);
            } else {
                errorAlert.classList.remove('d-none');
                errorText.textContent = data.error || "Analysis failed.";
            }
        })
        .catch(err => {
            clearInterval(interval);
            errorAlert.classList.remove('d-none');
            errorText.textContent = "Connection error during analysis execution.";
        });
});
</script>
{% endblock %}
