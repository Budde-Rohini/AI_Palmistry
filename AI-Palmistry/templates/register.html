{% extends 'base.html' %}

{% block title %}Create Account - AI Palmistry{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="glass-card p-4 p-md-5 rounded-4 border-gold-subtle shadow-lg">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Create Account</h2>
                    <p class="text-secondary small">Register to save and manage your AI palmistry reports.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger bg-danger bg-opacity-10 border-danger text-danger rounded-3 small mb-4">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small text-secondary fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-subtle border-secondary border-opacity-25 text-gold"><i class="fa-solid fa-at"></i></span>
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary border-opacity-25" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-secondary fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-subtle border-secondary border-opacity-25 text-gold"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control bg-dark text-light border-secondary border-opacity-25" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-secondary fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-subtle border-secondary border-opacity-25 text-gold"><i class="fa-solid fa-key"></i></span>
                            <input type="password" name="password" class="form-control bg-dark text-light border-secondary border-opacity-25" placeholder="At least 6 characters" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-lg w-100 rounded-pill fw-semibold mb-3">
                        <i class="fa-solid fa-user-check me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center border-top border-secondary border-opacity-10 pt-3 mt-3">
                    <span class="text-secondary small">Already have an account? </span>
                    <a href="{{ url_for('login') }}" class="text-gold text-decoration-none fw-semibold small hover-gold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
